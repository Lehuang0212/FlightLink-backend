name: FlightLink ECS Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: Check OpenAPI contract drift
        run: python -m flightlink.api.openapi_export
      - name: Run pytest and Hypothesis PBT suite
        run: pytest -v
      - name: Verify runtime wheel excludes project dev skills
        run: |
          pip install build
          python -m build --wheel --outdir dist/
          python -c "
          import zipfile, pathlib
          whl = next(pathlib.Path('dist').glob('flightlink_ecs-*.whl'))
          with zipfile.ZipFile(whl) as zf:
              names = zf.namelist()
          assert not any('.agents' in n for n in names), f'Dev skills leaked into wheel: {names}'
          print('Wheel verified clean:', whl.name)
          "
