[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlink-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alibabacloud-credentials>=0.3.6",
    "alibabacloud-ecs20140526",
    "fastapi>=0.141.1",
    "pymavlink>=2.4.49",
    "uvicorn>=0.54.0",
]

[project.scripts]
ConsoleUseradd = "flightlink_backend.cli:add_admin"

[tool.setuptools.packages.find]
where = ["src"]
