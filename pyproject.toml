[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightlink-ecs"
version = "1.0.0"
description = "FlightLink ECS 1.0 backend (flightlink-api, flightlink-agent, flightlink-archive, flightlink CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyJWT>=2.9.0",
    "PyYAML>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
aliyun = [
    "alibabacloud-credentials>=0.3.6",
    "alibabacloud-ecs20140526>=4.0.0",
]
mavlink = [
    "pymavlink>=2.4.49",
]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[project.scripts]
flightlink = "flightlink.cli.main:cli"
flightlink-api = "flightlink.api.runner:main"
flightlink-agent = "flightlink.domain.agent_runner:main"
flightlink-archive = "flightlink.archive.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flightlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
